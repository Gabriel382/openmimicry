schema_version: 1

windows:
  overlay:
    width: 360
    height: 420
    transparent: true
    frameless: true
    always_on_top: true
    movable: true
  controls:
    width: 360
    height: 92
    always_on_top: true
  panel:
    width: 480
    height: 720

theme:
  font_family: Inter, Arial, sans-serif
  accent: "#ff8a3d"
  panel_bg: "#16161a"
  panel_text: "#dddddd"
  bubble_bg: "rgba(20, 20, 22, 0.88)"
  bubble_text: "#f4f4f6"
  controls_bg: "rgba(18, 22, 30, 0.82)"
  controls_border: "rgba(255, 255, 255, 0.14)"
  input_bg: "rgba(255, 255, 255, 0.10)"
  input_border: "rgba(255, 255, 255, 0.18)"

layout:
  bubble_max_width: 330
  avatar_width: 330
  avatar_scale: 1.0
  controls_gap: 6

behaviour:
  bubble:
    # Display duration = min(max_ms, base_ms + characters * ms_per_character).
    base_ms: 2500
    ms_per_character: 55
    max_ms: 30000
  controls:
    show: true
    show_drag_handle: true
    show_text_input: true
    drag_label: Drag OpenMimicry
